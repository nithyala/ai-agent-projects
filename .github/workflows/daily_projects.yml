name: 🤖 Daily AI Agent Project Generator

on:
  schedule:
    - cron: '0 18 * * *'   # Every day at 6 PM UTC
  workflow_dispatch:         # Allow manual trigger from GitHub UI

jobs:
  generate-project:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Generate today's 2 AI agent projects
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_daily_projects.py

      - name: Commit and push new projects
        run: |
          git config --global user.name "Nithya AI Bot"
          git config --global user.email "nithyajambulingam1315@gmail.com"
          git add .
          git diff --staged --quiet || git commit -m "🤖 Auto-generated AI agent projects — $(date +'%Y-%m-%d')"
          git push
